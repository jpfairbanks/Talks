<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cellular Sheaf Explorer</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: var(--plane, #f9f9f7); }
  sheaf-explorer { display: block; height: 100%; }
</style>
</head>
<body>
<sheaf-explorer></sheaf-explorer>

var me={"bare-square":`# The same square with the brace deleted, and nothing else changed.
#
# One edge apart from \`braced-square.toml\`, and the readout goes from 3 to 4:
# the framework now has a shear flex beyond the trivial motions, so the same
# three pins leave one degree of freedom, and sweeping the null vector
# animates the square shearing into a rhombus.

[sheaf]
name = "Bare square"
dim  = 2

[[vertices]]
id = "a"
p0 = [0.0, 0.0]

[[vertices]]
id = "b"
p0 = [1.0, 0.0]

[[vertices]]
id = "c"
p0 = [1.0, 1.0]

[[vertices]]
id = "d"
p0 = [0.0, 1.0]

[[edges]]
from = "a"
to   = "b"
stalk = 1
map  = { kind = "direction" }

[[edges]]
from = "b"
to   = "c"
stalk = 1
map  = { kind = "direction" }

[[edges]]
from = "c"
to   = "d"
stalk = 1
map  = { kind = "direction" }

[[edges]]
from = "d"
to   = "a"
stalk = 1
map  = { kind = "direction" }

[defaults]
pins = ["a", "b.y"]

[expect]
dim_ker_D = 4     # 3 trivial + 1 shear flex
residual  = 0.0
`,"braced-square":`# The rigidity sheaf on a square with one diagonal brace.
#
# Each edge constrains the component of relative motion along its own length,
# which is exactly the rigidity matrix of the framework. The brace removes the
# shear flex, leaving only the Euclidean trivial motions.

[sheaf]
name = "Braced square"
dim  = 2

[[vertices]]
id = "a"
p0 = [0.0, 0.0]

[[vertices]]
id = "b"
p0 = [1.0, 0.0]

[[vertices]]
id = "c"
p0 = [1.0, 1.0]

[[vertices]]
id = "d"
p0 = [0.0, 1.0]

[[edges]]
from = "a"
to   = "b"
stalk = 1
map  = { kind = "direction" }

[[edges]]
from = "b"
to   = "c"
stalk = 1
map  = { kind = "direction" }

[[edges]]
from = "c"
to   = "d"
stalk = 1
map  = { kind = "direction" }

[[edges]]
from = "d"
to   = "a"
stalk = 1
map  = { kind = "direction" }

# The brace, written out explicitly to exercise the syntax. It is the same map
# \`{ kind = "direction" }\` would generate for this edge: the unit vector along
# a -> c, with each end's offset \`-u . p0\` so that the reference configuration
# satisfies it. The two ends differ only in that offset, which is why this edge
# needs \`from_map\` / \`to_map\` rather than a single shared \`map\`.
[[edges]]
from     = "a"
to       = "c"
stalk    = 1
from_map = { kind = "explicit", A = [[0.7071067811865476, 0.7071067811865476]], b = [0.0] }
to_map   = { kind = "explicit", A = [[0.7071067811865476, 0.7071067811865476]], b = [-1.4142135623730951] }

[defaults]
pins = ["a", "b.y"]

[expect]
dim_ker_D = 3     # exactly the Euclidean trivial motions in 2D
residual  = 0.0
`,"degenerate-triangle":`# Rigid, but not infinitesimally rigid: where the linearisation lies.
#
# Three collinear agents, every pair joined. Because a, b and c are in a line,
# |ac| = |ab| + |bc| exactly, and the triangle inequality is tight. So there is
# no other configuration with these three distances: the framework is *rigid*.
# Move b off the line by any finite amount and |ab| and |bc| both grow.
#
# The sheaf does not see that. Its edges constrain
#
#     u . (p_u - p_v) = u . (p0_u - p0_v)
#
# where \`u\` is the unit vector along the edge in the reference configuration.
# That is the derivative of the distance constraint, not the constraint: it
# says the relative velocity has no component *along* the edge. Here all three
# edges point the same way, so every vertical motion satisfies all three, and
# \`D\` comes out 3x6 of rank 2 rather than 3. One degree of freedom too many.
#
# Pin a and c and the survivor is exactly b.y. Sweep it and watch:
#
#     t     |ab|     |bc|    Dirichlet energy
#     0.0   1.0000   1.0000  0
#     0.3   1.0440   1.0440  0
#     0.6   1.1662   1.1662  0
#
# The bars visibly stretch and the sheaf reports no cost at all, because the
# growth is second order in t and the linearisation kept only the first. That
# is the whole content of the word "infinitesimal": \`ker D\` is the tangent
# space to the set of valid configurations, and at a degenerate point like this
# one the tangent space is bigger than the set it is tangent to. The flex is a
# direction you can start to move in, not a direction you can move in.
#
# Nudge b off the line -- change its p0 to [1.0, 0.35] -- and the degeneracy
# goes: rank becomes 3, dim ker D drops to the 3 trivial motions, and the
# framework becomes infinitesimally rigid. Degeneracy is the exception, which
# is why infinitesimal rigidity is usually the right thing to test for.

[sheaf]
name = "Degenerate triangle"
dim  = 2

[[vertices]]
id   = "a"
icon = "target"
p0   = [0.0, 0.0]

[[vertices]]
id   = "b"
icon = "target"
p0   = [1.0, 0.0]

[[vertices]]
id   = "c"
icon = "target"
p0   = [2.0, 0.0]

[[edges]]
from  = "a"
to    = "b"
stalk = 1
map   = { kind = "direction" }

[[edges]]
from  = "b"
to    = "c"
stalk = 1
map   = { kind = "direction" }

[[edges]]
from  = "a"
to    = "c"
stalk = 1
map   = { kind = "direction" }

[defaults]
pins = ["a", "c"]   # leaves exactly the phantom flex: b moving off the line

[expect]
dim_ker_D = 4       # 3 trivial planar motions, plus one that is not a motion
residual  = 0.0
`,"infeasible-cycle":`# A doubly-braced square with an offset on one edge: infeasible.
#
# An offset can only break feasibility when the framework carries a
# *self-stress*, because \`r_sheaf = min_p || D p - c ||\` is nonzero exactly when
# \`c\` has a component in \`ker D^T\`. The singly-braced square of
# \`braced-square.toml\` has \`D\` of shape 5x8 and rank 5 -- surjective, so
# \`ker D^T = 0\` and every right-hand side is reachable, no matter what offsets
# are written. Adding the second diagonal makes it 6x8, still of rank 5 (the
# rigidity matrix of a 4-vertex framework in the plane cannot exceed 2*4 - 3),
# so one self-stress appears and the offset finally has somewhere to obstruct.
#
# That self-stress is the cycle the obstruction cochain lights up. Dragging the
# offset in app mode makes the residual move continuously, which demonstrates
# infeasibility better than a dimension counter flipping.

[sheaf]
name = "Infeasible cycle"
dim  = 2

[[vertices]]
id = "a"
p0 = [0.0, 0.0]

[[vertices]]
id = "b"
p0 = [1.0, 0.0]

[[vertices]]
id = "c"
p0 = [1.0, 1.0]

[[vertices]]
id = "d"
p0 = [0.0, 1.0]

[[edges]]
from   = "a"
to     = "b"
stalk  = 1
map    = { kind = "direction" }
offset = [0.3]

[[edges]]
from = "b"
to   = "c"
stalk = 1
map  = { kind = "direction" }

[[edges]]
from = "c"
to   = "d"
stalk = 1
map  = { kind = "direction" }

[[edges]]
from = "d"
to   = "a"
stalk = 1
map  = { kind = "direction" }

[[edges]]
from = "a"
to   = "c"
stalk = 1
map  = { kind = "direction" }

[[edges]]
from = "b"
to   = "d"
stalk = 1
map  = { kind = "direction" }

[defaults]
pins = ["a", "b.y"]

[expect]
dim_ker_D = 3      # still just the trivial motions; the extra edge adds a stress, not a flex
residual  = 0.10606601717798213   # 0.3 / (2 * sqrt(2)): the offset projected onto the self-stress
`,"multi-domain-tracking":`# Who can track whom is cohomological.
#
# The widget behind that slide: surface agents and targets in a volume.
#
# A scaled-down version of the tracking scenario -- planar agents coordinating
# with targets that live in three dimensions. Surface vehicles track their
# targets through a projection they can measure, and the restriction maps carry
# the dimension change.
#
#   quadcopter R^3 --[ 1 0 0 ; 0 1 0 ]--> R^2 <--[ I ]-- ship R^2
#   submarine  R^3 --[ 1 0 0 ; 0 1 0 ]--> R^2 <--[ I ]-- ship R^2
#
# Ships also hold formation with each other: those edges are the rigidity
# sheaf, so dragging one ship carries the others with it.
#
# Agents are named by single letters -- a to d are the ships, e and f the
# submarines beneath a and b, g and h the quadcopters above c and d. The icon
# says what each one is, so the name does not have to.
#
# What the widget is for
# ----------------------
#
# The panel opens isometric: the horizontal plane tilted away from the camera,
# altitude straight up, and a dashed line from each target down to the point it
# stands over.
#
# Drag a ship. Its target chases it, because the projection ties the target's
# plan position to the ship's. Now shift-drag that target up and down: the
# Dirichlet energy does not move. Altitude is in the kernel of the projection,
# so no edge can see it and no configuration pays for it.
#
# Then try to shift-drag a ship. Nothing happens -- not because it is pinned,
# but because a ship's stalk is R^2. It has no altitude to change. That
# asymmetry is the point: a 2D asset cannot determine a 3D asset's altitude
# because it has none of its own to compare against.
#
# As relative cohomology
# ----------------------
#
# Pinning a set A of agents and asking what freedom survives computes
# H^0(X, A), and "DOF remaining" is its dimension.
#
#   - Pin the ships (the 2D layer). Every target's plan position is then
#     determined, but its depth or altitude is not: H^0(X, A) has dimension 4,
#     one per 3D asset.
#
#   - Pin the targets (the 3D layer). Every ship is the projection of a pinned
#     3D state, so H^0(X, A) vanishes.
#
# The projection is surjective on stalks but not injective, and the surviving
# classes are exactly its kernel.

[sheaf]
name = "Who can track whom"
dim  = 3      # ambient; ships override with stalk = 2

# --- surface agents: R^2, no altitude at all -------------------------------
#
# \`icon\` only changes how an agent is drawn; the sheaf does not depend on it.

[[vertices]]
id   = "a"
icon = "ship"
stalk = 2
p0    = [0.0, 0.0]

[[vertices]]
id   = "b"
icon = "ship"
stalk = 2
p0    = [3.0, 0.4]

[[vertices]]
id   = "c"
icon = "ship"
stalk = 2
p0    = [4.2, 3.0]

[[vertices]]
id   = "d"
icon = "ship"
stalk = 2
p0    = [1.0, 2.6]

# --- submerged targets: R^3, depth below the surface -----------------------

[[vertices]]
id   = "e"
icon = "submarine"
p0 = [0.0, 0.0, -1.3]

[[vertices]]
id   = "f"
icon = "submarine"
p0 = [3.0, 0.4, -0.9]

# --- airborne agents: R^3, altitude above the surface ----------------------

[[vertices]]
id   = "g"
icon = "quadcopter"
p0 = [4.2, 3.0, 1.5]

[[vertices]]
id   = "h"
icon = "quadcopter"
p0 = [1.0, 2.6, 1.1]

# --- agent-to-agent: the ships hold formation ------------------------------

[[edges]]
from  = "a"
to    = "b"
stalk = 1
map   = { kind = "direction" }

[[edges]]
from  = "b"
to    = "c"
stalk = 1
map   = { kind = "direction" }

[[edges]]
from  = "c"
to    = "d"
stalk = 1
map   = { kind = "direction" }

[[edges]]
from  = "d"
to    = "a"
stalk = 1
map   = { kind = "direction" }

[[edges]]
from  = "a"
to    = "c"
stalk = 1
map   = { kind = "direction" }

# --- cross-domain: the restriction maps carry the dimension change ---------
#
# The edge stalk is the horizontal plane, and both ends restrict to it by
# \`projection\`: for the 3D asset that forgets the third coordinate, and for the
# ship, whose stalk is already the plane, it is the identity. One map, written
# once, for an edge whose two ends are genuinely different maps.

[[edges]]
from     = "e"
to       = "a"
stalk    = 2
map      = { kind = "projection" }

[[edges]]
from     = "f"
to       = "b"
stalk    = 2
map      = { kind = "projection" }

[[edges]]
from     = "g"
to       = "c"
stalk    = 2
map      = { kind = "projection" }

[[edges]]
from     = "h"
to       = "d"
stalk    = 2
map      = { kind = "projection" }

[view]
# A low camera flattens the ground plane almost edge-on, which is what makes
# the altitudes the dominant feature rather than a detail: the drop-lines read
# as plumb lines and a target sliding up and down is unmistakable. Orbit with
# alt+drag, or [ ] and { }, to see the plan arrangement instead.
azimuth    = 115
elevation  = 14
projection = "isometric"

[defaults]
pins = ["a", "b", "c", "d"]   # the 2D layer: 4 DOF survive

[expect]
dim_ker_D = 7    # 3 planar motions of the whole formation + 4 free altitudes
residual  = 0.0
`,"offset-formation":`# Holding a formation by offset, not by distance.
#
# Every edge here is \`translation\`: the edge stalk is the *full* vertex stalk,
# both restriction maps are the identity on the linear part, and each end
# carries its own reference position as the affine offset. The section
# condition is then
#
#     p_to - p_from = delta
#
# an exact linear equation on the relative position. Compare \`direction\`, whose
# edge stalk is R^1 and which constrains only \`u . (p_to - p_from)\` for a \`u\`
# frozen at the reference layout: the linearisation of the distance.
#
# What changes
# ------------
#
#              edges  D       rank  dim ker D   rotate by 0.4 rad
#   direction      4  4 x 8      4          4   energy 1.25e-2  (linearisation error)
#   translation    4  8 x 8      6          2   energy 3.16e-1  (genuinely disallowed)
#
# Two things are different, and only one of them is about rigidity.
#
# The kernel shrinks to \`dim = 2\`, the translations, because a fixed offset in
# world axes pins orientation as well as shape. There is no rotation and no
# shear to be had -- which is right, and is why \`dim ker D\` here is \`d\` rather
# than \`d(d+1)/2\`.
#
# And the constraint is *exact*. Translate this formation by any amount, however
# large, and the Dirichlet energy is zero -- not small, zero. Nothing was
# dropped, so there is no second-order error to accumulate, no degenerate
# configuration where the rank collapses, and no gap between the flexes and the
# motions. The \`True rotations\` checkbox never appears, because none of these
# flexes generates a rotation.
#
# Feasibility is a cocycle condition
# -------------------------------------
#
# The reference layout sets \`delta\`, but only as a parameter: write
# \`delta = [2.5, 0.0]\` on one edge to ask for a different offset. Do that here
# and the sheaf becomes infeasible, which is the point.
#
# A set of desired offsets is realizable exactly when it sums to zero around
# every cycle -- it has to be the coboundary of a configuration, not merely an
# assignment of vectors to edges. Round this square the layout's offsets give
# (1,0) + (0,1) + (-1,0) + (0,-1) = 0. Stretch one side to 2.5 and the sum is
# (1.5, 0): the formation cannot close, and \`r_sheaf\` becomes 0.75, the gap
# spread over the cycle's four edges.
#
# Scale all four offsets, or shear them together, and the sum still vanishes
# and the sheaf stays feasible. So \`r_sheaf\` here is not measuring a
# linearisation error, as it would for \`direction\`. It is measuring a genuine
# obstruction: the class of the offset assignment in the cokernel.

[sheaf]
name = "Offset formation"
dim  = 2

[[vertices]]
id   = "a"
icon = "quadcopter"
p0   = [0.0, 0.0]

[[vertices]]
id   = "b"
icon = "quadcopter"
p0   = [1.0, 0.0]

[[vertices]]
id   = "c"
icon = "quadcopter"
p0   = [1.0, 1.0]

[[vertices]]
id   = "d"
icon = "quadcopter"
p0   = [0.0, 1.0]

[[edges]]
from  = "a"
to    = "b"
stalk = 2
map   = { kind = "translation" }

[[edges]]
from  = "b"
to    = "c"
stalk = 2
map   = { kind = "translation" }

[[edges]]
from  = "c"
to    = "d"
stalk = 2
map   = { kind = "translation" }

[[edges]]
from  = "d"
to    = "a"
stalk = 2
map   = { kind = "translation" }

[defaults]
pins = ["a"]     # one agent determines the whole formation

[expect]
dim_ker_D = 2    # the translations, and nothing else
residual  = 0.0

:root {
  color-scheme: light;

  --surface:        #fcfcfb;
  --plane:          #f9f9f7;
  --ink:            #0b0b0b;
  --ink-2:          #52514e;
  --ink-muted:      #898781;
  --grid:           #e1e0d9;
  --axis:           #c3c2b7;
  --hairline:       rgba(11, 11, 11, 0.10);

  /* Identity: agents, and the agents that carry the residual freedom. */
  --agent:          #2a78d6;
  --flex:           #eb6834;

  /* Magnitude: edge discrepancy, one hue light to dark. */
  --mag-0:          #cde2fb;
  --mag-1:          #86b6ef;
  --mag-2:          #3987e5;
  --mag-3:          #256abf;
  --mag-4:          #104281;

  /* Status. Never reused for a series; always shipped with a label. */
  --good:           #0ca30c;
  --critical:       #d03b3b;

  /*
   * Presentation scale. 1 at a desk; larger when the widget is on a projector
   * and the back row has to read it. Everything sized in the components is
   * written against this, and the formation view reads the same number in
   * script for the geometry CSS cannot reach.
   */
  --ui-scale: 1;

  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;

    --surface:      #1a1a19;
    --plane:        #0d0d0d;
    --ink:          #ffffff;
    --ink-2:        #c3c2b7;
    --ink-muted:    #898781;
    --grid:         #2c2c2a;
    --axis:         #383835;
    --hairline:     rgba(255, 255, 255, 0.10);

    --agent:        #3987e5;
    --flex:         #d95926;

    --mag-0:        #104281;
    --mag-1:        #256abf;
    --mag-2:        #3987e5;
    --mag-3:        #86b6ef;
    --mag-4:        #cde2fb;

    --good:         #0ca30c;
    --critical:     #d03b3b;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;

  --surface:        #1a1a19;
  --plane:          #0d0d0d;
  --ink:            #ffffff;
  --ink-2:          #c3c2b7;
  --ink-muted:      #898781;
  --grid:           #2c2c2a;
  --axis:           #383835;
  --hairline:       rgba(255, 255, 255, 0.10);

  --agent:          #3987e5;
  --flex:           #d95926;

  --mag-0:          #104281;
  --mag-1:          #256abf;
  --mag-2:          #3987e5;
  --mag-3:          #86b6ef;
  --mag-4:          #cde2fb;

  --good:           #0ca30c;
  --critical:       #d03b3b;

:host {
  /* The split positions, as a share of the shell. Dragging a gutter writes
     these; everything else is laid out from them. */
  --split-x: 68%;
  --split-y: 62%;

  display: grid;
  padding: 12px;
  gap: 0;
  background: var(--plane);
  color: var(--ink);
  min-height: 0;
  grid-template-columns: minmax(180px, var(--split-x)) 10px minmax(200px, 1fr);
  grid-template-rows: minmax(120px, var(--split-y)) 10px minmax(60px, 1fr);
  grid-template-areas:
    "view    colgut controls"
    "rowgut  colgut controls"
    "source  colgut controls";
}

/* A slide is one screen and never scrolls: no source panel, so no row split. */
:host([mode="slide"]) {
  padding: 10px;
  grid-template-rows: minmax(0, 1fr);
  grid-template-areas: "view colgut controls";
}
:host([mode="slide"]) ::slotted([slot="source"]),
:host([mode="slide"]) .gutter-row { display: none; }

::slotted([slot="view"]) { grid-area: view; min-height: 0; }
::slotted([slot="controls"]) { grid-area: controls; overflow: auto; }
::slotted([slot="source"]) { grid-area: source; min-height: 0; }

/* Gutters are the spacing between panels as well as the handles that move
   them, so the panels keep their gaps whether or not anyone drags. */
.gutter {
  position: relative;
  background: none;
  border: 0;
  padding: 0;
  border-radius: 3px;
}
.gutter::after {
  content: "";
  position: absolute;
  inset: 0;
  margin: auto;
  border-radius: 3px;
  background: var(--axis);
  opacity: 0;
  transition: opacity 120ms;
}
.gutter:hover::after,
.gutter:focus-visible::after,
.gutter[data-dragging]::after { opacity: 0.85; }
.gutter:focus-visible { outline: 2px solid var(--agent); outline-offset: -2px; }

.gutter-col { grid-area: colgut; cursor: col-resize; touch-action: none; }
.gutter-col::after { width: 3px; height: 34px; }
.gutter-row { grid-area: rowgut; cursor: row-resize; touch-action: none; }
.gutter-row::after { width: 34px; height: 3px; }

@media (max-width: 760px) {
  :host, :host([mode="slide"]) {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(260px, 46vh) auto auto;
    grid-template-areas: "view" "controls" "source";
    gap: 10px;
  }
  .gutter { display: none; }
}

  font-size: calc(11px * var(--ui-scale, 1));
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-muted);
}
.status { font-size: calc(11px * var(--ui-scale, 1)); color: var(--good); }
.status.bad { color: var(--critical); }

textarea {
  flex: 1;
  min-height: 220px;
  resize: vertical;
  border: 0;
  outline: none;
  padding: 12px;
  font-family: var(--mono);
  font-size: calc(12px * var(--ui-scale, 1));
  line-height: 1.55;
  tab-size: 2;
  color: var(--ink);
  background: var(--surface);
}

.errors { border-top: 1px solid var(--hairline); max-height: 160px; overflow: auto; }
.errors:empty { display: none; }
.error {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  border-radius: 0;
  background: none;
  padding: 7px 12px;
  font-size: calc(12px * var(--ui-scale, 1));
  color: var(--ink);
  cursor: pointer;
  border-bottom: 1px solid var(--hairline);
}
.error:hover { background: var(--plane); }
.error .where {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--critical);
  padding-right: 7px;
}

:host {

  border-radius: 10px;
  overflow: hidden;

}
svg { display: block; width: 100%; height: 100%; cursor: grab; }
svg.panning { cursor: grabbing; }
:host(:focus-visible) { outline: 2px solid var(--agent); outline-offset: 2px; }

.edge { stroke-linecap: round; fill: none; }

.ground-fill { fill: var(--grid); opacity: 0.18; stroke: none; }

  stroke: var(--ink-muted);

  opacity: 0.7;

.dropfoot { fill: var(--ink-muted); opacity: 0.55; }

  stroke-linecap: round;
  opacity: 0.45;
  pointer-events: none;
}
.obstruction { stroke: var(--critical); stroke-linecap: round; fill: none; opacity: 0.8; }

.agent { stroke: var(--surface); stroke-width: 2; cursor: grab; }
.agent:active { cursor: grabbing; }
.agent-free { fill: var(--surface); stroke: var(--agent); }
.agent-pinned { fill: var(--agent); stroke: var(--surface); }
.agent-flex { stroke: var(--flex); stroke-width: calc(3px * var(--ui-scale, 1)); fill: none; }
.axis-glyph {
  stroke: var(--agent);
  stroke-width: calc(2.5px * var(--ui-scale, 1));
  stroke-linecap: round;

/* Vendored artwork is stroked, never filled; it reads against whichever plate

.glyph { fill: none; pointer-events: none; stroke-linecap: round; stroke-linejoin: round; }
.glyph-on-pinned { stroke: var(--surface); }
.glyph-on-free { stroke: var(--agent); }

.agent-label {

  font-size: calc(11px * var(--ui-scale, 1));
  font-weight: 500;
  fill: var(--ink-2);
  pointer-events: none;
  user-select: none;

  pointer-events: none;

.legend span { display: inline-flex; align-items: center; gap: 5px; }

.viewport select {

  color: var(--ink);

.viewport .zoom {

  text-align: right;
  padding-right: 2px;
}

  flex-direction: column;

  min-height: 0;
  background: var(--plane);

  font: inherit;
  font-size: calc(13px * var(--ui-scale, 1));
  padding: 3px 7px;
  border-radius: 6px;
  border: 1px solid var(--axis);
  background: var(--surface);
  color: inherit;
}
sheaf-app { flex: 1; min-height: 0; }
.failure {
  margin: 0;
  padding: 18px;
  font-family: var(--mono, ui-monospace, monospace);
  font-size: 13px;
  color: var(--bad, #b00);
}
